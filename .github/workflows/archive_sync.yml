name: Sync Historical Archive By Month

on:
  schedule:
    # 11:00 Asia/Shanghai on day 1 (03:00 UTC), after the daily CSV job.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      sync_month:
        description: "Month for existing CNEMC/ZJEMC/PVPower sync, YYYY-MM; defaults to last month"
        required: false
        default: ""
      himawari_month:
        description: "Himawari month to migrate, YYYY-MM; defaults to 13 months before the current month"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-historical-archive
  cancel-in-progress: false
  queue: max

jobs:
  sync-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run archive validation unit tests
        run: python -m unittest discover -s tests -v

      # 第一步：准备月份参数（默认上个月）
      - name: Prepare month parameters
        id: params
        env:
          SYNC_MONTH_INPUT: ${{ inputs.sync_month }}
          HIMAWARI_MONTH_INPUT: ${{ inputs.himawari_month }}
        run: |
          set -euo pipefail

          if [ -z "$SYNC_MONTH_INPUT" ]; then
            sync_month=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          else
            sync_month="$SYNC_MONTH_INPUT"
          fi
          if [ -z "$HIMAWARI_MONTH_INPUT" ]; then
            himawari_month=$(date -u -d "$(date -u +%Y-%m-01) -13 months" +%Y-%m)
          else
            himawari_month="$HIMAWARI_MONTH_INPUT"
          fi

          for value in "$sync_month" "$himawari_month"; do
            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}$ ]] || \
               [ "$(date -u -d "$value-01" +%Y-%m 2>/dev/null || true)" != "$value" ]; then
              echo "Invalid month: $value (expected YYYY-MM)"
              exit 1
            fi
          done

          start_date="${sync_month}-01"
          end_date=$(date -u -d "$start_date +1 month" +%Y-%m-%d)

          echo "sync_month=$sync_month" >> "$GITHUB_OUTPUT"
          echo "himawari_month=$himawari_month" >> "$GITHUB_OUTPUT"
          echo "start_date=$start_date" >> "$GITHUB_OUTPUT"
          echo "end_date=$end_date" >> "$GITHUB_OUTPUT"

      # 第二步：（1）同步 CNEMC 指定月份的日期文件夹
      - name: Sync CNEMC archive
        run: |
          set -e

          sync_month="${{ steps.params.outputs.sync_month }}"
          mkdir -p Archive/CNEMC

          tmp_dir="/tmp/cnemc_repo"
          rm -rf "$tmp_dir"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/StorywithLove/workflow.git "$tmp_dir"
          cd "$tmp_dir"
          git sparse-checkout init --no-cone
          git sparse-checkout set "Archive/CNEMC/${sync_month}-*"
          git checkout --progress
          cd -

          mapfile -t dirs < <(find "$tmp_dir/Archive/CNEMC" -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | sort)
          total=${#dirs[@]}
          echo "Found $total CNEMC folders for $sync_month."

          i=0
          for base in "${dirs[@]}"; do
            i=$((i+1))
            echo "[$i/$total] Syncing CNEMC/$base"
            mkdir -p "Archive/CNEMC/$base"
            rsync -a --ignore-existing "$tmp_dir/Archive/CNEMC/$base/" "Archive/CNEMC/$base/"
            file_count=$(find "Archive/CNEMC/$base" -type f | wc -l)
            echo "[$i/$total] Finished $base, local file count: $file_count"
          done

      # 第二步：（2）同步 ZJEMC 指定月份的日期文件夹
      - name: Sync ZJEMC archive
        run: |
          set -e

          sync_month="${{ steps.params.outputs.sync_month }}"
          mkdir -p Archive/ZJEMC

          tmp_dir="/tmp/zjemc_repo"
          rm -rf "$tmp_dir"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/StorywithLove/workflow.git "$tmp_dir"
          cd "$tmp_dir"
          git sparse-checkout init --no-cone
          git sparse-checkout set "Archive/ZJEMC/${sync_month}-*"
          git checkout --progress
          cd -

          mapfile -t dirs < <(find "$tmp_dir/Archive/ZJEMC" -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | sort)
          total=${#dirs[@]}
          echo "Found $total ZJEMC folders for $sync_month."

          i=0
          for base in "${dirs[@]}"; do
            i=$((i+1))
            echo "[$i/$total] Syncing ZJEMC/$base"
            mkdir -p "Archive/ZJEMC/$base"
            rsync -a --ignore-existing "$tmp_dir/Archive/ZJEMC/$base/" "Archive/ZJEMC/$base/"
            file_count=$(find "Archive/ZJEMC/$base" -type f | wc -l)
            echo "[$i/$total] Finished $base, local file count: $file_count"
          done
          
      # 第二步：（3）同步 PVPower 指定月份的每日文件
      - name: Sync PVPower archive
        run: |
          set -e

          sync_month="${{ steps.params.outputs.sync_month }}"
          mkdir -p "Archive/PVPower/${sync_month}"

          tmp_dir="/tmp/pvpower_repo"
          rm -rf "$tmp_dir"

          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/StorywithLove/workflow.git "$tmp_dir"
          cd "$tmp_dir"
          git sparse-checkout init --no-cone
          git sparse-checkout set "Archive/PVPower/${sync_month}/HZ_${sync_month}-*.csv"
          git checkout --progress
          cd -

          if [ ! -d "$tmp_dir/Archive/PVPower/${sync_month}" ]; then
            echo "No PVPower month directory found for $sync_month."
            exit 0
          fi

          file_count=$(find "$tmp_dir/Archive/PVPower/${sync_month}" -maxdepth 1 -type f -name "HZ_${sync_month}-*.csv" | wc -l)
          echo "Found $file_count PVPower files for $sync_month."

          if [ "$file_count" -eq 0 ]; then
            echo "No PVPower files to sync for $sync_month."
            exit 0
          fi

          rsync -a --ignore-existing \
            "$tmp_dir/Archive/PVPower/${sync_month}/" \
            "Archive/PVPower/${sync_month}/"

          local_count=$(find "Archive/PVPower/${sync_month}" -maxdepth 1 -type f -name "HZ_${sync_month}-*.csv" | wc -l)
          echo "Finished PVPower sync for $sync_month, local file count: $local_count"
          
      # 第三步：（4）归档超过一年保留期限的 Himawari 月份
      - name: Validate and archive expired Himawari month
        id: himawari
        env:
          HIMAWARI_MONTH: ${{ steps.params.outputs.himawari_month }}
        run: |
          set -euo pipefail

          year="${HIMAWARI_MONTH%-*}"
          month="${HIMAWARI_MONTH#*-}"
          source_dir="data/daily/${year}/${month}"
          tmp_dir="/tmp/envdata_sat_repo"
          rm -rf "$tmp_dir"

          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/StorywithLove/envdata-sat.git "$tmp_dir"
          cd "$tmp_dir"
          git sparse-checkout init --no-cone
          git sparse-checkout set "$source_dir" "config/cities.json"
          git checkout --progress
          cd -

          if [ ! -d "$tmp_dir/$source_dir" ]; then
            echo "No envdata-sat data exists for expired month $HIMAWARI_MONTH; nothing to migrate."
            echo "archived=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/archive_himawari_month.py \
            --month "$HIMAWARI_MONTH" \
            --source-dir "$tmp_dir/$source_dir" \
            --archive-root "Archive/Himawari" \
            --cities-json "$tmp_dir/config/cities.json"

          echo "archived=true" >> "$GITHUB_OUTPUT"

      # 第三步：提交并推送
      - name: Commit external archive
        id: commit-archive
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Archive/CNEMC Archive/ZJEMC Archive/PVPower Archive/Himawari

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync CNEMC, ZJEMC, PVPower & Himawari archives for ${{ steps.params.outputs.sync_month }}"
            git pull --rebase
            git push --progress
          fi
          echo "archive_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request verified source cleanup in envdata-sat
        if: steps.himawari.outputs.archived == 'true'
        env:
          SAT_TOKEN: ${{ secrets.ENV_DATA_SAT_TOKEN }}
          HIMAWARI_MONTH: ${{ steps.params.outputs.himawari_month }}
          ARCHIVE_COMMIT: ${{ steps.commit-archive.outputs.archive_commit }}
        run: |
          set -euo pipefail
          if [ -z "$SAT_TOKEN" ]; then
            echo "::warning::Archive is committed, but ENV_DATA_SAT_TOKEN is not configured. Source cleanup was not requested."
            echo "Add a fine-grained token with Contents: write access to StorywithLove/envdata-sat, then add it as ENV_DATA_SAT_TOKEN in this repository's Actions secrets."
            exit 0
          fi
          payload=$(python -c 'import json,os; print(json.dumps({"event_type":"archive-verified","client_payload":{"month":os.environ["HIMAWARI_MONTH"],"archive_commit":os.environ["ARCHIVE_COMMIT"]}}))')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SAT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/StorywithLove/envdata-sat/dispatches \
            -d "$payload"
          echo "Requested source cleanup for verified Himawari month $HIMAWARI_MONTH."
